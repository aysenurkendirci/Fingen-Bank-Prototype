# The app shell carries a per-request nonce, so it must never be stored; hashed scripts and styles can be.
map $sent_http_content_type $page_cache_control {
    ~^text/html "no-store";
    default     "";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The nginx version is nobody's business.
    server_tokens off;

    # Same paths the Angular dev server proxies (src/proxy.conf.json). The API sends its own security headers.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 3m;
    }

    # Client-side routes (/dashboard, /transactions ...) all load the app shell.
    location / {
        try_files $uri $uri/ /index.html;

        # Every page gets a fresh nonce: $request_id is 128 random bits. Angular puts it on the <style> tags it
        # writes, so a <style> injected by anyone else is refused. The page is never cached, or the nonce would be.
        sub_filter '__CSP_NONCE__' $request_id;
        sub_filter_once off;
        sub_filter_types text/html;

        # What the page may load: its own scripts only (no inline script, no eval), its own and nonced styles,
        # Google Fonts, and calls to its own origin. Style attributes stay allowed (style-src-attr): ECharts
        # writes its tooltips with them, and an attribute cannot load or run anything. frame-ancestors keeps
        # the bank out of other sites' frames (clickjacking).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control $page_cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Only honoured over HTTPS, where TLS ends in front of this container; harmless over plain HTTP.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
