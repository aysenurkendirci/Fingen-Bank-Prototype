# Secret scanning rules for CI (gitleaks). The default rules apply; the only exceptions are two throwaway values
# that exist on purpose: the SQL Server password of the CI container and the signing key of the integration tests.
# Neither protects anything outside a test run.

[extend]
useDefault = true

[allowlist]
description = "Throwaway credentials of CI containers and integration tests"
regexes = [
  '''Ci_Only_Passw0rd!''',
  '''integration-tests-signing-key-[0-9a-f]+''',
]
