name: CodeQL

# Static analysis for security flaws (injection, unsafe deserialisation, XSS sinks, path traversal ...) in the C# and
# TypeScript code. Findings appear under Security > Code scanning. A weekly run also catches new queries.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      # No build needed: CodeQL reads the source directly for both languages.
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
