name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Stops a key or password from reaching the repository. Runs on the commits of each push and pull request.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest

    # Integration tests run against a real SQL Server, as they do locally.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Throwaway container that only lives for this job; not a secret worth protecting.
          MSSQL_SA_PASSWORD: "Ci_Only_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_Only_Passw0rd!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Only the publisher test needs it; without RABBITMQ_HOST that test is skipped.
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      RABBITMQ_HOST: localhost
      INTEGRATION_TESTS_DB: "Server=localhost,1433;Database=BankDb_IntegrationTests;User Id=sa;Password=Ci_Only_Passw0rd!;TrustServerCertificate=True"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Bank.slnx -c Release -warnaserror

      - name: Check for vulnerable packages
        run: |
          dotnet list Bank.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

      - name: Unit tests
        run: dotnet test tests/Bank.UnitTests -c Release --no-build --logger GitHubActions

      - name: Integration tests
        run: dotnet test tests/Bank.IntegrationTests -c Release --no-build --logger GitHubActions

  # The whole system as docker-compose.yml describes it: built, started, and checked through nginx the way a
  # browser would reach it. Sign-up proves the migrator ran and the API reaches the database.
  compose:
    runs-on: ubuntu-latest
    env:
      SQL_SA_PASSWORD: "Ci_Only_Passw0rd!"
      JWT_KEY: "ci-only-signing-key-that-is-long-enough-123"
      RABBITMQ_PASSWORD: "ci-only"
    steps:
      - uses: actions/checkout@v7

      - name: Start the system
        run: docker compose up --build --detach

      - name: Smoke test through nginx
        run: |
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:8080/ && break
            sleep 5
          done
          curl -fsSI http://localhost:8080/ | grep -i "content-security-policy"
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/api/auth/refresh -H "X-Requested-By: bank-web")
            [ "$status" = "401" ] && break
            sleep 5
          done
          curl -fsS -X POST http://localhost:8080/api/auth/register -H "Content-Type: application/json"             -d '{"tcNo":"10000000146","firstName":"Ci","lastName":"Kontrol","email":"ci@example.com","phone":"5550000000","password":"Ci_Kontrol1","membership":"Personal"}'             | grep -q '"token"'

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down --volumes

  # The app in a real browser against a real API and database: sign-up, accounts, transfers, planning, goals,
  # profile and erasure (frontend/e2e).
  e2e:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Only_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_Only_Passw0rd!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BankDb: "Server=localhost,1433;Database=BankDb_E2E;User Id=sa;Password=Ci_Only_Passw0rd!;TrustServerCertificate=True"
      Jwt__Key: "ci-only-signing-key-that-is-long-enough-123"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # In Development the API brings the database up to date itself before it serves anything.
      - name: Start the API
        run: |
          dotnet run --project backend/src/Bank.Api --urls http://localhost:5164 > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:5164/health/ready > /dev/null && exit 0
            sleep 3
          done
          cat api.log
          exit 1

      - name: Install
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Layer boundaries
        run: node scripts/check-layers.mjs

      - name: Production build
        run: npx ng build bank-app

      - name: Unit tests
        run: npx ng test bank-app --watch=false
